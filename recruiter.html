<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Candidate Portal | VectorShift Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            min-height: 100vh;
            width: 100vw;
            background-color: #030712 !important;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .bg-tech-pattern {
            background-color: #030712;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.25) 0%, transparent 70%),
                radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(51, 65, 85, 0.75);
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
        }
    </style>
</head>
<body class="bg-tech-pattern min-h-screen flex flex-col justify-between p-4 sm:p-8 relative">

    <!-- HEADER BRANDING -->
    <header class="max-w-5xl mx-auto w-full flex flex-col sm:flex-row items-center justify-between py-6 border-b border-slate-800/80 z-10 gap-4">
        <div class="flex flex-wrap items-center gap-4 sm:gap-6">
            <img src="VectorShift_Lab_logo.png" alt="VectorShift Lab Logo" class="h-24 sm:h-28 w-auto object-contain filter drop-shadow-[0_0_30px_rgba(37,99,235,0.75)]">
            <span class="text-sm sm:text-base font-mono text-blue-300 bg-blue-950/90 px-4 py-2 rounded-full border border-blue-500/80 shadow-[0_0_15px_rgba(37,99,235,0.4)] tracking-wide uppercase font-bold">
                Powered by VectorShift Lab
            </span>
        </div>
        <div class="text-right hidden sm:block">
            <span class="text-xs font-mono text-slate-400 bg-slate-900/90 px-3 py-1.5 rounded-full border border-slate-800">
                Recruiter Portal v1.0
            </span>
        </div>
    </header>

    <!-- INTAKE FORM CONTAINER -->
    <main class="max-w-2xl mx-auto w-full my-auto py-8 z-10">
        <div class="glass-panel p-8 rounded-2xl border border-slate-700/60 space-y-6">
            <div class="text-center">
                <span class="inline-block px-3.5 py-1 text-xs font-semibold tracking-wider text-blue-400 bg-blue-950/80 rounded-full border border-blue-800/60 mb-3 uppercase">
                    Agency & Client Portal
                </span>
                <h1 class="text-2xl font-bold text-slate-100">Submit Candidate for Autonomous Screening</h1>
                <p class="text-sm text-slate-400 mt-1">Generate a role-specific technical evaluation link instantly</p>
            </div>

            <form id="recruiter-intake-form" onsubmit="generateCandidateLink(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Recruiter Name</label>
                        <input type="text" id="recruiter-name" required placeholder="e.g. Sarah Jenkins" class="w-full px-4 py-2.5 rounded-lg bg-slate-900/80 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Recruiter Email</label>
                        <input type="email" id="recruiter-email" required placeholder="sarah@agency.com" class="w-full px-4 py-2.5 rounded-lg bg-slate-900/80 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <div class="border-t border-slate-800 pt-4">
                    <label class="block text-xs font-medium text-slate-300 mb-1">Target Semiconductor Role</label>
                    <select id="candidate-role" required class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-blue-400 font-semibold focus:outline-none focus:border-blue-500">
                        <option value="Die Attach Engineer">Die Attach Engineer</option>
                        <option value="Mold Process Engineer">Mold Process Engineer</option>
                        <option value="Wire Bond Process Engineer">Wire Bond Process Engineer</option>
                        <option value="Substrate Packaging Engineer">Substrate Packaging Engineer</option>
                        <option value="Wafer Fab Yield Engineer">Wafer Fab Yield Engineer</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Candidate Full Name</label>
                        <input type="text" id="candidate-name" required placeholder="e.g. David Chen" class="w-full px-4 py-2.5 rounded-lg bg-slate-900/80 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Candidate Email</label>
                        <input type="email" id="candidate-email" required placeholder="david.chen@gmail.com" class="w-full px-4 py-2.5 rounded-lg bg-slate-900/80 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <button type="submit" class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 font-semibold text-white transition-all shadow-xl shadow-blue-600/30 text-sm tracking-wide">
                    Generate Candidate Invite Link
                </button>
            </form>

            <div id="output-container" class="hidden p-5 rounded-xl bg-slate-900 border border-slate-800 space-y-3">
                <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider block">Generated Screening URL</span>
                <input type="text" id="generated-url" readonly class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded text-xs font-mono text-slate-200 select-all focus:outline-none">
                <button onclick="copyToClipboard()" class="w-full py-2 px-4 rounded bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 transition-all">
                    Copy Link to Clipboard
                </button>
            </div>
        </div>
    </main>

    <footer class="max-w-4xl mx-auto w-full text-center py-4 text-xs text-slate-500 z-10">
        &copy; 2026 VectorShift Lab. All rights reserved. Powered by Autonomous Voice AI.
    </footer>

    <script>
        function generateCandidateLink(e) {
            e.preventDefault();
            const role = encodeURIComponent(document.getElementById('candidate-role').value);
            const name = encodeURIComponent(document.getElementById('candidate-name').value);
            const email = encodeURIComponent(document.getElementById('candidate-email').value);

            const baseUrl = window.location.origin + '/index.html';
            const fullUrl = `${baseUrl}?role=${role}&name=${name}&email=${email}`;

            document.getElementById('generated-url').value = fullUrl;
            document.getElementById('output-container').classList.remove('hidden');
        }

        function copyToClipboard() {
            const urlInput = document.getElementById('generated-url');
            urlInput.select();
            navigator.clipboard.writeText(urlInput.value);
            alert("Candidate link copied to clipboard!");
        }
    </script>
</body>
</html>
