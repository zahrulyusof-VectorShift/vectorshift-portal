<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical AI Interview Portal | VectorShift Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            min-height: 100vh;
            width: 100vw;
            background-color: #030712 !important;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .hidden-ui { display: none !important; }
        .bg-tech-pattern {
            background-color: #030712;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.18) 0%, transparent 65%),
                radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(51, 65, 85, 0.6);
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }
    </style>
    <!-- Standalone Vapi Web Engine -->
    <script type="module">
        import Vapi from 'https://esm.sh/@vapi-ai/web';
        window.Vapi = Vapi;
    </script>
</head>
<body class="bg-tech-pattern min-h-screen flex flex-col justify-between p-4 sm:p-8">

    <!-- STAGE 1: CONFIRMATION & PRE-FLIGHT SYSTEM CHECK -->
    <div id="confirmation-modal" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md">
        <div class="glass-panel p-8 rounded-2xl max-w-lg w-full relative border border-slate-700/60 shadow-2xl">
            <div class="mb-6 text-center">
                <span class="inline-block px-3 py-1 text-xs font-semibold tracking-wider text-blue-400 bg-blue-950/60 rounded-full border border-blue-800/50 mb-3">
                    VECTORSHIFT LAB | VOICE SCREENER
                </span>
                <h1 class="text-2xl font-bold text-slate-100">Pre-Flight Candidate Check</h1>
                <p class="text-sm text-slate-400 mt-1">Confirm your details before initializing Maya AI</p>
            </div>

            <form onsubmit="handleConfirmation(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Full Name</label>
                    <input type="text" id="confirm-name" required placeholder="e.g. Alex Tan" class="w-full px-4 py-2.5 rounded-lg bg-slate-900/80 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Email Address</label>
                    <input type="email" id="confirm-email" required placeholder="alex.tan@example.com" class="w-full px-4 py-2.5 rounded-lg bg-slate-900/80 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500">
                </div>
                <button type="submit" class="w-full py-3 px-6 rounded-lg bg-blue-600 hover:bg-blue-500 font-semibold text-white transition-all shadow-lg shadow-blue-600/30">
                    Start Your AI Interview
                </button>
            </form>
        </div>
    </div>

    <!-- STAGE 2: INTERVIEW DASHBOARD -->
    <div id="interview-dashboard" class="hidden-ui max-w-4xl mx-auto w-full flex-grow flex flex-col justify-center space-y-6 my-auto">
        <div class="glass-panel p-6 rounded-2xl border border-slate-700/60 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <div>
                    <h2 id="dashboard-candidate-info" class="text-lg font-bold text-blue-400">Candidate Session</h2>
                    <p id="maya-status-text" class="text-xs text-slate-400 mt-0.5">Status: Initializing Voice Stream...</p>
                </div>
                <div id="timer-display" class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-sm font-mono text-emerald-400">
                    90s Remaining
                </div>
            </div>

            <div class="p-4 rounded-xl bg-slate-900/90 border border-slate-800/80 min-h-[160px] flex flex-col justify-between">
                <div>
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-2">Live Transcript Stream</span>
                    <p id="live-transcript" class="text-sm text-slate-200 leading-relaxed italic">
                        "Maya is preparing interview prompts..."
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- ENGINE & LOGIC -->
    <script>
        const VAPI_PUBLIC_KEY = "2fc52977-ec09-4b46-9ee8-deb2fabb92fd";
        const VAPI_ASSISTANT_ID = "9291bb86-e2a4-436e-a792-add4762ab8dd";

        let vapiInstance = null;
        let timerInterval = null;

        function start90sTimer() {
            let secondsLeft = 90;
            const timerEl = document.getElementById('timer-display');
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                secondsLeft--;
                if (timerEl) timerEl.innerText = `${secondsLeft}s Remaining`;
                if (secondsLeft <= 0) {
                    clearInterval(timerInterval);
                    if (vapiInstance) vapiInstance.stop();
                    if (timerEl) timerEl.innerText = "Session Complete";
                }
            }, 1000);
        }

        async function handleConfirmation(e) {
            if (e) e.preventDefault();

            const nameInput = document.getElementById('confirm-name');
            const emailInput = document.getElementById('confirm-email');
            
            if (!nameInput.value || !emailInput.value) return;

            const confirmedName = nameInput.value;
            const confirmedEmail = emailInput.value;

            document.getElementById('dashboard-candidate-info').innerText = `${confirmedName} (${confirmedEmail})`;
            document.getElementById('confirmation-modal').classList.add('hidden-ui');
            document.getElementById('interview-dashboard').classList.remove('hidden-ui');

            try {
                document.getElementById('maya-status-text').innerText = "Status: Connecting to Maya AI...";
                
                let VapiSDK = window.Vapi;
                if (!VapiSDK) {
                    const module = await import("https://esm.sh/@vapi-ai/web");
                    VapiSDK = module.default || module.Vapi;
                    window.Vapi = VapiSDK;
                }

                if (!VapiSDK) {
                    alert("Audio engine loading. Please wait 3 seconds and click Start again.");
                    return;
                }

                vapiInstance = new VapiSDK(VAPI_PUBLIC_KEY);
                vapiInstance.start(VAPI_ASSISTANT_ID);

                vapiInstance.on('call-start', () => {
                    document.getElementById('maya-status-text').innerText = "Status: Connected & Listening";
                    document.getElementById('live-transcript').innerText = "Maya: Greeting candidate...";
                    start90sTimer();
                });

                vapiInstance.on('message', (message) => {
                    if (message.type === 'transcript') {
                        const role = message.role === 'assistant' ? 'Maya' : confirmedName;
                        document.getElementById('live-transcript').innerText = `${role}: "${message.transcript}"`;
                    }
                });

                vapiInstance.on('call-end', () => {
                    document.getElementById('maya-status-text').innerText = "Status: Session Ended";
                    if (timerInterval) clearInterval(timerInterval);
                });

                vapiInstance.on('error', (err) => {
                    console.error("Vapi Error:", err);
                    document.getElementById('maya-status-text').innerText = "Status: Connection Error";
                });

            } catch (err) {
                console.error("Initialization error:", err);
                alert("Could not start audio stream. Please verify microphone permissions.");
            }
        }
    </script>
</body>
</html>
